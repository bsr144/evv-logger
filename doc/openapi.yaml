openapi: 3.0.3
info:
  title: EVV Logger API
  version: 1.0.0
  description: |
    Electronic Visit Verification (EVV) Logger API for tracking caregiver shifts and tasks.
    Caregivers clock in/out of scheduled patient visits and complete tasks during each shift.
    The system records GPS coordinates at clock-in and clock-out for location verification.
  contact:
    name: EVV Logger
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: Health check endpoint
  - name: Schedules
    description: Caregiver shift schedule management
  - name: Tasks
    description: Task management within schedules

paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API server.
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/schedules:
    post:
      tags:
        - Schedules
      summary: Create a schedule
      description: Creates a new caregiver schedule for a patient visit. The schedule is initialized with status "upcoming".
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Schedule created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSuccessResponse"
        "400":
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidBody:
                  summary: Malformed JSON
                  value:
                    success: false
                    error: invalid request body
                validationError:
                  summary: Validation failure
                  value:
                    success: false
                    error: "validation failed: CaregiverName failed on 'required'"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: failed to create schedule

    get:
      tags:
        - Schedules
      summary: List all schedules
      description: Returns all schedules, optionally filtered by date. The response includes aggregate statistics across all matching schedules.
      operationId: listSchedules
      parameters:
        - name: date
          in: query
          required: false
          description: Filter schedules by date (format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-03-09"
      responses:
        "200":
          description: List of schedules with statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleListSuccessResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: failed to get schedules

  /api/v1/schedules/{id}:
    get:
      tags:
        - Schedules
      summary: Get a schedule by ID
      description: Returns a single schedule with its associated tasks.
      operationId: getScheduleByID
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "200":
          description: Schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDetailSuccessResponse"
        "400":
          description: Invalid schedule ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  summary: Non-numeric ID
                  value:
                    success: false
                    error: invalid schedule id
                nonPositiveId:
                  summary: Non-positive ID
                  value:
                    success: false
                    error: schedule id must be positive
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: schedule not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: failed to get schedule

    patch:
      tags:
        - Schedules
      summary: Update a schedule
      description: |
        Partially updates a schedule. Used primarily for status transitions and recording
        clock-in/clock-out events with GPS coordinates. All fields are optional.
      operationId: updateSchedule
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: Schedule updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSuccessResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  summary: Non-numeric ID
                  value:
                    success: false
                    error: invalid schedule id
                invalidBody:
                  summary: Malformed JSON
                  value:
                    success: false
                    error: invalid request body
                invalidStatus:
                  summary: Invalid status transition
                  value:
                    success: false
                    error: invalid status transition
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: schedule not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: failed to update schedule

  /api/v1/schedules/stats:
    get:
      tags:
        - Schedules
      summary: Get schedule statistics
      description: Returns aggregate counts of schedules grouped by status.
      operationId: getScheduleStats
      responses:
        "200":
          description: Schedule statistics
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ScheduleStats"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/schedules/{id}/tasks:
    post:
      tags:
        - Tasks
      summary: Create a task for a schedule
      description: Creates a new task associated with the given schedule. The task is initialized with status "pending".
      operationId: createTask
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSuccessResponse"
        "400":
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  summary: Non-numeric schedule ID
                  value:
                    success: false
                    error: invalid schedule id
                invalidBody:
                  summary: Malformed JSON
                  value:
                    success: false
                    error: invalid request body
                validationError:
                  summary: Validation failure
                  value:
                    success: false
                    error: "validation failed: Description failed on 'required'"
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: schedule not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: failed to create task

    get:
      tags:
        - Tasks
      summary: List tasks for a schedule
      description: Returns all tasks associated with the given schedule.
      operationId: listTasksBySchedule
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListSuccessResponse"
        "400":
          description: Invalid schedule ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  summary: Non-numeric schedule ID
                  value:
                    success: false
                    error: invalid schedule id
                nonPositiveId:
                  summary: Non-positive schedule ID
                  value:
                    success: false
                    error: schedule id must be positive
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: schedule not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: failed to get tasks

  /api/v1/schedules/{id}/tasks/{taskId}:
    patch:
      tags:
        - Tasks
      summary: Update a task
      description: |
        Partially updates a task. Used to mark tasks as completed or not_completed.
        When setting status to "not_completed", notes are required to explain why.
      operationId: updateTask
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSuccessResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidScheduleId:
                  summary: Non-numeric schedule ID
                  value:
                    success: false
                    error: invalid schedule id
                invalidTaskId:
                  summary: Non-numeric task ID
                  value:
                    success: false
                    error: invalid task id
                invalidBody:
                  summary: Malformed JSON
                  value:
                    success: false
                    error: invalid request body
                invalidStatus:
                  summary: Invalid status value
                  value:
                    success: false
                    error: invalid status
                notesRequired:
                  summary: Notes required for not_completed
                  value:
                    success: false
                    error: notes required when status is not_completed
        "404":
          description: Task or schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                scheduleNotFound:
                  summary: Schedule not found
                  value:
                    success: false
                    error: schedule not found
                taskNotFound:
                  summary: Task not found
                  value:
                    success: false
                    error: task not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: failed to update task

components:
  parameters:
    ScheduleID:
      name: id
      in: path
      required: true
      description: Schedule ID (positive integer)
      schema:
        type: integer
        minimum: 1
        example: 1

    TaskID:
      name: taskId
      in: path
      required: true
      description: Task ID (positive integer)
      schema:
        type: integer
        minimum: 1
        example: 1

  schemas:
    # ---------------------
    # Request Schemas
    # ---------------------
    CreateScheduleRequest:
      type: object
      required:
        - caregiver_name
        - patient_name
        - date
        - start_time
        - end_time
      properties:
        caregiver_name:
          type: string
          maxLength: 200
          description: Name of the caregiver
          example: Jane Doe
        patient_name:
          type: string
          maxLength: 200
          description: Name of the patient
          example: John Smith
        date:
          type: string
          format: date
          maxLength: 10
          description: Date of the scheduled visit (YYYY-MM-DD)
          example: "2026-03-09"
        start_time:
          type: string
          maxLength: 5
          description: Start time of the shift (HH:MM, 24-hour format)
          example: "09:00"
        end_time:
          type: string
          maxLength: 5
          description: End time of the shift (HH:MM, 24-hour format)
          example: "17:00"
        location:
          type: string
          maxLength: 500
          description: Address or description of the visit location
          example: "123 Main St, Springfield, IL"

    UpdateScheduleRequest:
      type: object
      description: All fields are optional. Include only the fields to update.
      properties:
        status:
          type: string
          enum:
            - upcoming
            - in_progress
            - completed
            - missed
          description: New status for the schedule
          example: in_progress
        clock_in_time:
          type: string
          format: date-time
          description: Timestamp when the caregiver clocked in
          example: "2026-03-09T09:02:00Z"
        clock_in_lat:
          type: number
          format: double
          description: Latitude of clock-in location
          example: 39.7817
        clock_in_lng:
          type: number
          format: double
          description: Longitude of clock-in location
          example: -89.6501
        clock_out_time:
          type: string
          format: date-time
          description: Timestamp when the caregiver clocked out
          example: "2026-03-09T17:05:00Z"
        clock_out_lat:
          type: number
          format: double
          description: Latitude of clock-out location
          example: 39.7817
        clock_out_lng:
          type: number
          format: double
          description: Longitude of clock-out location
          example: -89.6501

    CreateTaskRequest:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          maxLength: 500
          description: Description of the task to be performed
          example: Administer medication

    UpdateTaskRequest:
      type: object
      description: All fields are optional. Include only the fields to update.
      properties:
        status:
          type: string
          enum:
            - pending
            - completed
            - not_completed
          description: New status for the task
          example: completed
        notes:
          type: string
          maxLength: 1000
          description: Notes about the task. Required when status is "not_completed".
          example: Patient refused medication

    # ---------------------
    # Response Schemas
    # ---------------------
    Schedule:
      type: object
      properties:
        id:
          type: integer
          description: Unique schedule identifier
          example: 1
        caregiver_name:
          type: string
          description: Name of the caregiver
          example: Jane Doe
        patient_name:
          type: string
          description: Name of the patient
          example: John Smith
        date:
          type: string
          format: date
          description: Date of the scheduled visit
          example: "2026-03-09"
        start_time:
          type: string
          description: Start time of the shift (HH:MM)
          example: "09:00"
        end_time:
          type: string
          description: End time of the shift (HH:MM)
          example: "17:00"
        status:
          type: string
          enum:
            - upcoming
            - in_progress
            - completed
            - missed
          description: Current status of the schedule
          example: upcoming
        clock_in_time:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the caregiver clocked in
        clock_in_lat:
          type: number
          format: double
          nullable: true
          description: Latitude of clock-in location
        clock_in_lng:
          type: number
          format: double
          nullable: true
          description: Longitude of clock-in location
        clock_out_time:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the caregiver clocked out
        clock_out_lat:
          type: number
          format: double
          nullable: true
          description: Latitude of clock-out location
        clock_out_lng:
          type: number
          format: double
          nullable: true
          description: Longitude of clock-out location
        location:
          type: string
          description: Address or description of the visit location
          example: "123 Main St, Springfield, IL"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the schedule was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the schedule was last updated

    Task:
      type: object
      properties:
        id:
          type: integer
          description: Unique task identifier
          example: 1
        schedule_id:
          type: integer
          description: ID of the parent schedule
          example: 1
        description:
          type: string
          description: Description of the task
          example: Administer medication
        status:
          type: string
          enum:
            - pending
            - completed
            - not_completed
          description: Current status of the task
          example: pending
        notes:
          type: string
          description: Notes about the task
          example: ""
        created_at:
          type: string
          format: date-time
          description: Timestamp when the task was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the task was last updated

    ScheduleStats:
      type: object
      properties:
        total:
          type: integer
          description: Total number of schedules
          example: 10
        upcoming:
          type: integer
          description: Number of schedules with status "upcoming"
          example: 3
        in_progress:
          type: integer
          description: Number of schedules with status "in_progress"
          example: 2
        completed:
          type: integer
          description: Number of schedules with status "completed"
          example: 4
        missed:
          type: integer
          description: Number of schedules with status "missed"
          example: 1

    ScheduleListData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        stats:
          $ref: "#/components/schemas/ScheduleStats"

    ScheduleDetailData:
      type: object
      properties:
        schedule:
          $ref: "#/components/schemas/Schedule"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    # ---------------------
    # Envelope Wrappers
    # ---------------------
    ScheduleSuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Schedule"

    ScheduleListSuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/ScheduleListData"

    ScheduleDetailSuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/ScheduleDetailData"

    TaskSuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Task"

    TaskListSuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Human-readable error message
          example: invalid request body
