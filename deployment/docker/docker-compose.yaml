services:
  app:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: evv-logger
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
    env_file:
      - path: ../../.env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - evv-network

networks:
  evv-network:
    driver: bridge
